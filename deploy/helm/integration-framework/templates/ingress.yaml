{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "integration-framework.name" . }}
  labels:
    {{- include "integration-framework.labels" . | nindent 4 }}
  {{- with .Values.ingress.className }}
  annotations:
    ingressClassName: {{ . }}
  {{- end }}
spec:
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "integration-framework.name" . }}-frontend
                port:
                  number: 8080
{{- end }}
