{{- if .Values.worker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "integration-framework.name" . }}-worker
  labels:
    {{- include "integration-framework.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  # Scales horizontally: run claims use concurrency tokens (exactly-once) and
  # scheduled runs are deduped per interval via the queue's unique index.
  replicas: {{ .Values.worker.replicas | default 2 }}
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "integration-framework.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "integration-framework.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      containers:
        - name: worker
          image: "{{ .Values.image.apiRepository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: IF_ROLE
              value: worker
            - name: METADATA_CONNECTION_STRING
              {{- if .Values.metadata.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.metadata.existingSecret }}
                  key: {{ .Values.metadata.existingSecretKey }}
              {{- else }}
              value: {{ include "integration-framework.metadataConnectionString" . | quote }}
              {{- end }}
            {{- if .Values.sso.enabled }}
            - name: SSO_TENANT_ID
              value: {{ .Values.sso.tenantId | quote }}
            - name: SSO_CLIENT_ID
              value: {{ .Values.sso.clientId | quote }}
            {{- if .Values.sso.existingSecret }}
            - name: SSO_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.sso.existingSecret }}
                  key: {{ .Values.sso.existingSecretKey }}
            {{- end }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
{{- end }}
