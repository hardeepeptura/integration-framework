apiVersion: v1
kind: Service
metadata:
  name: {{ include "integration-framework.name" . }}-api
  labels:
    {{- include "integration-framework.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "integration-framework.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "integration-framework.name" . }}-frontend
  labels:
    {{- include "integration-framework.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "integration-framework.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
