server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: serve index.html for client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend proxies (service name 'api' resolves via compose/K8s DNS)
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Pass through the scheme set by the outer TLS-terminating ingress;
        # absent (direct http access / port-forward) → header omitted, plain http.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /auth/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /webhook/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /demo/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }
}
